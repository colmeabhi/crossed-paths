[project]
name = "encore"
version = "0.1.0"
description = "ENCORE: encounter-based connection recommendation on Neo4j (Westeros Edition)"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.20",
    "python-dotenv>=1.0",
    "bcrypt>=4.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline", "app"]
